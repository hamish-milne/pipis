name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # for the coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The DOM tests also run in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      # Type check, lint, format check, tests, the import layers, action pins, sizes, the packed tarball and the site build.
      - run: pnpm exec vp run --concurrency-limit 2 all
      # The unit tests' coverage (recorded by the `test` task), as a comment on the pull request and in the job summary.
      - uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        if: always()
        continue-on-error: true # a pull request from a fork has a read-only token and cannot comment
        with:
          file-coverage-mode: none
      # The tarball a release would publish, so a packaging problem shows up on the pull request.
      - run: node tools/pack.ts out/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: out/release/pipis/*.tgz
          if-no-files-found: error
          retention-days: 14
