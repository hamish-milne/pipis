name: Publish

# Stages a package on npm when a GitHub release is published (`npm stage publish`); nothing goes live until a maintainer approves the
# staged version on npmjs.com (or with `npm stage approve <id>`), which asks for 2FA.
#
# The tag says which package: `v0.1.0` is `pipis` (packages/pipis), and `docs-kit-v0.1.0-beta.1` is `@pipis/docs-kit` (packages/docs-kit).
# Each version is that package's own package.json's.
#
# Three jobs, so that nothing that installs or runs the repository's dependencies holds a credential:
#  - verify: checks the tag, runs everything, and builds what will be published. Read-only token. Uploads the result.
#  - publish: has the npm (OIDC) credential and does nothing but download what verify built and stage it. No checkout, no install.
#  - assets: has write access to the release and does nothing but download the same files and attach them.
# Authentication is npm Trusted Publishing (OIDC): there is no npm token. The package must have a trusted publisher configured on
# npmjs.com for this repository, workflow `publish.yml`, and environment `npm`, with `npm stage publish` allowed (RUNBOOKS.md).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package: ${{ steps.which.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to tell whether the tagged commit is on main
      # the version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Which package the tag is for, and that its version matches the tag
        id: which
        run: |
          case "$GITHUB_REF_NAME" in
            docs-kit-v*) package=docs-kit; tag_version="${GITHUB_REF_NAME#docs-kit-v}" ;;
            v*) package=pipis; tag_version="${GITHUB_REF_NAME#v}" ;;
            *) echo "tag $GITHUB_REF_NAME is for no package (v1.2.3 is pipis, docs-kit-v1.2.3 is @pipis/docs-kit)"; exit 1 ;;
          esac
          version=$(node -p "require('./packages/$package/package.json').version")
          [ "$tag_version" = "$version" ] || { echo "tag $GITHUB_REF_NAME, packages/$package/package.json $version"; exit 1; }
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: a release is made from main"; exit 1; }
      - run: pnpm exec vp run --concurrency-limit 2 all
      # What publish and assets will use, built here with a read-only token, so what was verified is what goes out.
      - name: Build the package
        run: |
          package=${{ steps.which.outputs.package }}
          node packages/$package/tools/pack.ts out/release
          # The tarball goes on the release page as it is. Staging packs the folder again, so the folder alone goes to publish.
          mkdir -p out/assets
          cp out/release/$package/*.tgz out/assets/
          rm -f out/release/$package/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/release/${{ steps.which.outputs.package }}
            out/assets/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # `npm stage publish` needs npm 11.15.0 or later: this exact version, never `latest`.
      - run: |
          npm --version
          [ "$(printf '%s\n' 11.15.0 "$(npm --version)" | sort -V | head -n1)" = 11.15.0 ] || npm install -g npm@11.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Stage
        run: |
          # A prerelease (0.1.0-beta.1) goes under its own tag, so `npm install` of the package stays on the last stable release.
          #   1.0.0-beta.2 -> beta.2 -> beta (letters of the first part) | 1.0.0-2 -> 2 -> next (nothing left) | 1.0.0 -> latest
          package=${{ needs.verify.outputs.package }}
          version=$(node -p "require('./out/release/$package/package.json').version")
          case "$version" in *-*) tag=$(echo "${version#*-}" | cut -d. -f1 | tr -d '0-9') ; tag=${tag:-next} ;; *) tag=latest ;; esac
          [ "$tag" != latest ] || [ "$version" = "${version%%-*}" ] || { echo "a prerelease may not be called latest"; exit 1; }
          echo "staging $version with tag $tag"
          (cd out/release/$package && npm stage publish --tag "$tag" --access public)
          echo "Staged. Approve the version on npmjs.com (Staged Packages), or: npm stage list; npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"

  # The tarball on the release page, whether or not the npm version is approved yet.
  assets:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to attach the file to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" out/assets/*.tgz --clobber
